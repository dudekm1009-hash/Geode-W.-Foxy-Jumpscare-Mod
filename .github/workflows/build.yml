name: Build Geode Android Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build unzip wget git

      - name: Android NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26d" >> $GITHUB_ENV

      - name: Install Geode
        run: |
          curl -fsSL https://geode-sdk.org/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          geode build android

      - uses: actions/upload-artifact@v4
        with:
          name: WitheredFoxyJumpscare
          path: build/*.geode
